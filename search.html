<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Donors | LifeDrop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="logo"><span class="drop">●</span> LifeDrop</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="search.html" class="active">Find Donors</a></li>
        <li><a href="request.html">Request Blood</a></li>
        <li><a href="donor.html">Become a Donor</a></li>
        <li><a href="admin.html">Admin</a></li>
      </ul>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline btn-sm">Log In</a>
        <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    </div>
  </header>

  <div class="page-header text-center">
    <div class="container">
      <span class="eyebrow">Search module</span>
      <h1>Find a matching donor</h1>
      <p>Search by blood group, city, or availability status.</p>
    </div>
  </div>

  <section class="section" style="padding-top: 0;">
    <div class="container">

      <div class="card mb-lg">
        <form id="search-form" class="grid grid-4" style="align-items: end;">
          <div class="form-group" style="margin-bottom: 0;">
            <label for="search-bloodgroup">Blood group</label>
            <select id="search-bloodgroup">
              <option value="">Any</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label for="search-city">City</label>
            <input type="text" id="search-city" placeholder="e.g. Chattogram">
          </div>
          <div class="form-group checkbox-row" style="margin-bottom: 0;">
            <input type="checkbox" id="search-available">
            <label for="search-available" style="margin: 0;">Available only</label>
          </div>
          <div style="display: flex; gap: 0.5rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Search</button>
            <button type="button" id="search-reset" class="btn btn-outline">Reset</button>
          </div>
        </form>
      </div>

      <p class="hint" id="search-results-count" style="margin-bottom: 0.6rem;"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Blood Group</th>
              <th>City</th>
              <th>Phone</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="search-results-body">
          </tbody>
        </table>
      </div>

    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <div class="logo" style="color: var(--color-white);"><span class="drop">●</span> LifeDrop</div>
      <p>Online Blood Donation Management System</p>
    </div>
  </footer>
    <script src="script.js"></script>
</body>
</html>
